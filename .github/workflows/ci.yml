name: Data Pipeline CI

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "data/**"
      - "hotfix/**"
      - "release/**"
  pull_request:
    branches:
      - main
      - develop

# Cancel in-flight runs for the same branch/PR to save resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# Environment variables shared across jobs
# ─────────────────────────────────────────────────────────────────────────────
env:
  PYTHON_VERSION: "3.11"

# ─────────────────────────────────────────────────────────────────────────────
# JOBS
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Compile Check — catch syntax errors before anything else
  # ───────────────────────────────────────────────────────────────────────────
  compile-check:
    name: "🔍 Compile Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Compile all pipeline Python files
        run: |
          echo "Checking all .py files for syntax errors..."
          find . -name "*.py" \
            -not -path "./venv/*" \
            -not -path "./.git/*" \
            -not -path "*/__pycache__/*" \
            | xargs python -m py_compile
          echo "✅ All files compiled successfully."

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: Lint — enforce code style
  # ───────────────────────────────────────────────────────────────────────────
  lint:
    name: "🎨 Lint (flake8)"
    runs-on: ubuntu-latest
    needs: compile-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-dev-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-dev-

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run flake8
        run: |
          flake8 week2_etl/ week4_pipeline/ tests/ \
            --max-line-length=120 \
            --extend-ignore=E501,W503 \
            --exclude=venv,__pycache__,*.pyc \
            --statistics \
            --count
        continue-on-error: false

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: Unit Tests — fast, pure, no external dependencies
  # ───────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: "🧪 Unit Tests"
    runs-on: ubuntu-latest
    needs: compile-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: |
          pytest tests/test_transformations.py \
            -v \
            -m unit \
            --tb=short \
            --cov=week2_etl \
            --cov=week4_pipeline \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junit-xml=test-results-unit.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results-unit.xml

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4: Integration Tests — full pytest suite; skip gracefully if artifacts missing
  # ───────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: "🔗 Integration Tests"
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run integration tests
        run: |
          # The integration test suite uses pytest.skip() for tests that
          # require pipeline artifacts (warehouse.db, CSV outputs, etc.)
          # that are not present in CI. This is the correct behaviour —
          # integration tests run locally after pipeline execution.
          pytest tests/ \
            -v \
            -m "not unit" \
            --tb=short \
            --ignore=tests/test_transformations.py \
            --junit-xml=test-results-integration.xml \
            -rs  # show skip reasons
        continue-on-error: true  # integration tests are advisory in CI

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: test-results-integration.xml

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 5: Summary — print a test summary badge-style report
  # ───────────────────────────────────────────────────────────────────────────
  ci-summary:
    name: "📋 CI Summary"
    runs-on: ubuntu-latest
    needs: [compile-check, lint, unit-tests, integration-tests]
    if: always()

    steps:
      - name: Print CI Summary
        run: |
          echo "## 📋 Data Pipeline CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Compile Check | ${{ needs.compile-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎨 Lint (flake8) | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Unit Tests    | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔗 Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: \`${{ github.event_name }}\` on \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
