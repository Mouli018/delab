[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -ra
    --tb=short
    --strict-markers

# Custom markers
# Use -m "unit" to run only fast unit tests (no external deps)
# Use -m "integration" to run tests that need DB/API artifacts
markers =
    unit: Fast pure unit tests — no file I/O, no DB, no HTTP (run always)
    integration: Tests that require pipeline artifacts (DB, CSV, live API)
    slow: Tests that take > 10 seconds

# Minimum pytest version
minversion = 8.0
